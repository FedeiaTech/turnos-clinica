[project]
name = "turnos-clinica"
version = "0.3.0"
description = "Modulo de facturacion y cobro de turnos de una clinica"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "auditoria/"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["auditoria"]

[tool.ruff.lint]
# E/F: errores de pycodestyle y pyflakes, I: orden de imports,
# B: bugs probables, C90: complejidad ciclomatica, UP: sintaxis moderna
select = ["E", "F", "I", "B", "C90", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/turnos"]

[tool.coverage.report]
show_missing = true
fail_under = 80
